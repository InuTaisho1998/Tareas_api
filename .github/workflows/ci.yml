name: CI proyecto tareas

on:
  push:
    branches: [ "main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest
  
    steps:
  
    - name: copiar repositorio de codigo
      uses: actions/checkout@v4
  
    - name: configurar python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
  
    - name: instalar libretas o dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
  
    - name: correr test de sintaxis
      run: python -m compileall .

    - name: correr test con ruff
      run: ruff check .
  
    - name: correr test unitarios y de api
      run: python -m pytest

    - name: correr prueba de docker compose
      run: docker compose config --quiet
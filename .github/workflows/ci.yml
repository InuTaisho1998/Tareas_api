name: CI project tasks

on:
  push:
    branches: [ "main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest
  
    steps:
  
    - name: copy code repository
      uses: actions/checkout@v4
  
    - name: configure python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
  
    - name: install libraries or dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
  
    - name: run syntax test
      run: python -m compileall .

    - name: run test with ruff
      run: ruff check .
  
    - name: run unit and API test
      run: |
        docker compose up -d --build
        sleep 30
        curl --fail http://localhost:8000/docs || exit 1
        docker compose down
        
    - name: run a Docker Compose test
      env:
        SECRET_KEY: ${{secrets.SECRET_KEY}}
        POSTGRES_PASSWORD: ${{secrets.POSTGRES_PASSWORD}}
        POSTGRES_USER: ${{secrets.POSTGRES_USER}}
      run: docker compose up --build